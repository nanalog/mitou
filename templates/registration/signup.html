{% extends "base.html" %}

{% block content %}
<div class="ai-container" style="max-width: 450px; margin-top: 80px;">
    <div class="form-card" style="padding: 40px;">
        <header style="text-align: center; margin-bottom: 30px;">
            <h2 style="font-size: 28px;">Create Account</h2>
            <p style="color: var(--text-secondary); margin-top: 10px;">Join the AI platform today.</p>
        </header>

        <form method="post" class="ai-form">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary btn-full" style="margin-top: 20px;">
                Register
            </button>
        </form>
        
        <p style="text-align: center; margin-top: 20px; color: var(--text-secondary); font-size: 14px;">
            Already have an account? <a href="{% url 'login' %}" style="color: var(--primary-color);">Login here</a>
        </p>
    </div>
</div>
{% endblock %}
